name: Test
permissions: {}
env:
  UV_NO_SYNC: true
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
jobs:
  test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - '3.14'
        uv-resolution:
        - highest
        include:
        - os: ubuntu-latest
          python-version: '3.10'
          uv-resolution: lowest-direct
        - os: macos-latest
          python-version: '3.11'
          uv-resolution: highest
        - os: macos-latest
          python-version: '3.12'
          uv-resolution: lowest-direct
        - os: windows-latest
          python-version: '3.13'
          uv-resolution: highest
      fail-fast: false
    runs-on: self-hosted
    timeout-minutes: 12
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_RESOLUTION: ${{ matrix.uv-resolution }}
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python-version }}
    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.4
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Install Dependencies
      run: uv sync --no-dev --group tests
    - run: mkdir coverage
    - run: uv run bash scripts/test-files.sh
    - name: Test
      run: uv run bash scripts/test.sh
      env:
        COVERAGE_FILE: coverage/.coverage.${{ runner.os }}-py${{ matrix.python-version
          }}
        CONTEXT: ${{ runner.os }}-py${{ matrix.python-version }}
    - name: Store coverage files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: coverage-${{ runner.os }}-${{ matrix.python-version }}
        path: coverage
        include-hidden-files: true
  coverage-combine:
    needs:
    - test
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
    - name: Setup uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      with:
        version: 0.11.4
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Get coverage files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: coverage-*
        path: coverage
        merge-multiple: true
    - name: Install Dependencies
      run: uv sync --locked --no-dev --group tests
    - run: ls -la coverage
    - run: uv run coverage combine coverage
    - run: uv run coverage html --show-contexts --title "Coverage for ${{ github.sha
        }}"
    - name: Store coverage HTML
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: coverage-html
        path: htmlcov
        include-hidden-files: true
    - run: uv run coverage report --fail-under=100
    if: ${{ !cancelled() }}
  check:
    if: ${{ !cancelled() && (always()) }}
    needs:
    - coverage-combine
    - test
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: echo "$GITHUB_CONTEXT"
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
      with:
        jobs: ${{ toJSON(needs) }}
'on':
  push:
    branches:
    - master
  pull_request: null
  schedule:
  - cron: 0 0 * * 1
